name: CI

on:
  pull_request:
    branches: [main, develop, 'release/**']
    # 'labeled' so a pull request can switch a slow suite on after it was
    # opened, by adding run-integration or run-integration-emulated.
    types: [opened, reopened, synchronize, labeled]
  schedule:
    # Scheduled workflows only ever run from the default branch, which is
    # develop.
    - cron: '0 3 * * *'

# tests.yml defines the jobs. This file only decides which of them run.
#
#   unit                  the unit tests
#   settle                checks what architecture a build is for
#   integration           builds and runs the examples
#   integration-emulated  builds and runs the examples under qemu
#   canary                the unit tests on the unpinned -latest images
#
# What runs when:
#
#   pull request into develop            unit, settle
#     with label run-integration           + integration
#     with label run-integration-emulated  + integration-emulated
#
#   pull request into main or release/** unit, settle, integration,
#                                        integration-emulated
#
#   nightly, on develop                  unit, settle, integration,
#                                        integration-emulated, canary
#
# python-publish.yml calls tests.yml too, on a push:
#
#   push to develop                      unit, settle
#                                        -> development release to TestPyPI
#
#   push a version tag                   unit, settle, integration,
#                                        integration-emulated
#                                        -> stable release to PyPI and TestPyPI
#
# unit and settle take no switch, so they run on every call. Features are
# developed in feature/* branches and merged into develop, where unit and
# settle are the gate; the slow suites run on the way to main and nightly.
#
# A pull request must be up to date with its base before merge, so a
# regression cannot enter through two pull requests that share an older base.
# That is why there is no push trigger here.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    # The workflow triggers even when every slow job is switched off. A job
    # skipped by `if` reports as skipped, which branch protection accepts,
    # whereas a workflow that never triggers leaves the pull request waiting
    # for a status forever.
    with:
      # The example suite: builds and runs the examples.
      integration: >-
        ${{ github.event_name == 'schedule'
        || github.base_ref == 'main'
        || startsWith(github.base_ref, 'release/')
        || contains(github.event.pull_request.labels.*.name, 'run-integration') }}
      # The same suite under qemu, on architectures no runner provides. Same
      # occasions as integration, but a separate switch and a separate label,
      # so either can be asked for without the other.
      integration-emulated: >-
        ${{ github.event_name == 'schedule'
        || github.base_ref == 'main'
        || startsWith(github.base_ref, 'release/')
        || contains(github.event.pull_request.labels.*.name, 'run-integration-emulated') }}
      # Nightly only, and it gates nothing. Every other job pins its runner
      # image, so this is the only thing that runs on the -latest aliases and
      # reports what they point at now.
      canary: ${{ github.event_name == 'schedule' }}
