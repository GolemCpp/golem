[build-system]
requires = ["uv_build >= 0.9.18, <0.10.0"]
build-backend = "uv_build"

[project]
name = "golemcpp"
version = "1.3.0"
authors = [
  { name="Barnabé BALP", email="contact@barnabebalp.fr" },
]
description = "Golem is a cross-platform build system for C/C++ projects"
keywords = ["cpp"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "golemcpp-waflib==1.3.0",
    "node-semver==0.8.0",
]

[dependency-groups]
dev = [
  "node-semver==0.8.0",
  "pytest>=9.0,<10",
]

[project.urls]
Homepage = "https://github.com/GolemCpp/golem"
Documentation = "https://github.com/GolemCpp/golem"
Repository = "https://github.com/GolemCpp/golem.git"
Issues = "https://github.com/GolemCpp/golem/issues"

[project.scripts]
golem = "golemcpp.golem.main:main"

# pytest reads [tool.pytest.ini_options], not [tool.pytest]. Under the shorter
# name every setting below was silently ignored.
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [
    "tests",
]
markers = [
    # `settle` rather than `resolve`: resolving is what Golem does to a
    # project's dependencies, and a target is settled instead. These configure
    # an example and stop, which is all it takes -- what a build is for is
    # settled by the end of configure -- and stopping there is what makes an
    # emulated or scarce runner affordable. See the CI legs named
    # `Target settling`.
    "settle: configure an example to see what target it settles on",
]