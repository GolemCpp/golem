[build-system]
requires = ["uv_build >= 0.9.18, <0.10.0"]
build-backend = "uv_build"

[project]
name = "golemcpp"
version = "1.3.0"
authors = [
  { name="Barnabé BALP", email="contact@barnabebalp.fr" },
]
description = "Golem is a cross-platform build system for C/C++ projects"
keywords = ["cpp"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "golemcpp-waflib==1.3.0",
    "node-semver==0.8.0",
]

[dependency-groups]
dev = [
  # Capped at the year, because Black's stable style may change with each
  # calendar version.
  "black>=26.0,<27",
  "node-semver==0.8.0",
  "pytest>=9.0,<10",
  "ruff>=0.16,<1"
]

[project.urls]
Homepage = "https://github.com/GolemCpp/golem"
Documentation = "https://github.com/GolemCpp/golem"
Repository = "https://github.com/GolemCpp/golem.git"
Issues = "https://github.com/GolemCpp/golem/issues"

[project.scripts]
golem = "golemcpp.golem.main:main"

# pytest reads [tool.pytest.ini_options], not [tool.pytest]. Under the shorter
# name every setting below was silently ignored.
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [
    "tests",
]
markers = [
    # Named for where it stops. These run the real command line against a real
    # toolchain and go no further than configure, therefore they are cheap
    # enough for an emulated or scarce runner, and they are the only tests
    # outside the unit suite that run on every pull request.
    #
    # What target a build is for is settled by the end of configure, so this is
    # also where the architecture model is exercised for real.
    "configure: run the command line no further than configure",
    # Named for what the runner has to provide. A leg that cannot provide it
    # deselects the mark rather than naming the tests, which is what `-k` used
    # to do: a substring match says nothing at the test, so a test added later
    # is dropped from a leg with nothing to show for it.
    #
    # The `require_` guard in tests/host.py stays. It skips on a machine that
    # lacks the tool; the mark keeps a leg from starting the test at all.
    "qt: needs a Qt 6 installation",
    "packaging: needs the platform's packaging tool",
]

[tool.black]
# Strings here are single-quoted, for now.
skip-string-normalization = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Width only for now.
# To progressively fix the code by only checking what changes:
# ruff check --force-exclude $(git diff --name-only origin/develop... -- '*.py')
select = ["E501"]
